name: Creative Moments web checks
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web-checks.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check web/app.mjs && node --check web/data.mjs && node --check web/sw.js
      - name: Run web regression tests
        working-directory: web
        run: node --test tests/*.test.mjs

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test real browser workflows in mobile viewport
        run: python web/tests/browser-acceptance.py
      - name: Upload UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-moments-ui-review
          path: web/test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14

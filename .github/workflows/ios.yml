name: iOS build and tests

on:
  push:
    branches:
      - chore/creative-moments-phase1-audit
    paths:
      - 'CreativeMoments/**'
      - 'CreativeMomentsTests/**'
      - 'CreativeMoments.xcodeproj/**'
      - 'Tools/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main, chore/creative-moments-phase1-audit]

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          bash Tools/build_and_test.sh
      - name: Capture running home screen
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/DerivedData/Build/Products/Debug-iphonesimulator/CreativeMoments.app
          xcrun simctl launch "$DEVICE" com.example.CreativeMoments
          sleep 3
          mkdir -p build/screenshots
          xcrun simctl io "$DEVICE" screenshot build/screenshots/home.png
      - name: Upload home screenshot
        uses: actions/upload-artifact@v4
        with:
          name: creative-moments-home
          path: build/screenshots/home.png
